services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sitefitness-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_MINIO_PUBLIC_URL: /minio
      BACKEND_INTERNAL_URL: http://backend:5001
      MINIO_INTERNAL_URL: http://host.docker.internal:9000
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    command: npm run dev -- --hostname 0.0.0.0

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sitefitness-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://sitefitness:sitefitness@postgres:5432/sitefitness
      FRONTEND_ORIGIN: http://macmini:3000
      PUBLIC_FRONTEND_ORIGIN: https://gym.fratellidevs.com
      OPENWA_API_URL: http://host.docker.internal:2785/api
      PYTHONUNBUFFERED: "1"
    ports:
      - "5001:5001"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: sitefitness-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sitefitness
      POSTGRES_USER: sitefitness
      POSTGRES_PASSWORD: sitefitness
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitefitness -d sitefitness"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  frontend_node_modules:
  frontend_next:
